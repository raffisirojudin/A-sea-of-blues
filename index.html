<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A sea of blues</title>
    <meta
      name="description"
      content="An animated ocean scene that drifts through dawn, day, golden hour, sunset, and moonlight as you drag the time slider."
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23142238'/%3E%3Ccircle cx='32' cy='25' r='11' fill='%23ffd9a0'/%3E%3Cpath d='M6 42 Q19 36 32 42 T58 42' stroke='%23ffffff' stroke-width='4' fill='none' stroke-linecap='round' opacity='0.85'/%3E%3Cpath d='M6 50 Q19 44 32 50 T58 50' stroke='%23ffffff' stroke-width='3' fill='none' stroke-linecap='round' opacity='0.5'/%3E%3C/svg%3E"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="A sea of blues" />
    <meta
      property="og:description"
      content="Same sea — every hour a different blue. An animated, interactive ocean scene."
    />
    <meta
      property="og:url"
      content="https://raffisirojudin.github.io/A-sea-of-blues/"
    />
    <meta
      property="og:image"
      content="https://raffisirojudin.github.io/A-sea-of-blues/preview.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="A sea of blues" />
    <meta
      name="twitter:description"
      content="Same sea — every hour a different blue."
    />
    <meta
      name="twitter:image"
      content="https://raffisirojudin.github.io/A-sea-of-blues/preview.jpg"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="ocean" aria-hidden="true"></canvas>
    <!-- Overlay UI -->
    <div class="ui">
      <div class="ui-top">
        <div class="top-left">
          <div class="label" id="scene-label">◑ &nbsp;T I D E S</div>
          <div class="mode-switch" role="group" aria-label="Scene">
            <button
              type="button"
              class="mode-btn active"
              data-mode="ocean"
              aria-pressed="true"
            >
              OCEAN
            </button>
            <button
              type="button"
              class="mode-btn"
              data-mode="mountain"
              aria-pressed="false"
            >
              MOUNTAIN
            </button>
            <button
              type="button"
              class="mode-btn"
              data-mode="desert"
              aria-pressed="false"
            >
              DESERT
            </button>
          </div>
          <div
            class="mode-switch"
            id="season-switch"
            role="group"
            aria-label="Season"
          >
            <button
              type="button"
              class="season-btn"
              data-season="spring"
              aria-pressed="false"
            >
              SPR
            </button>
            <button
              type="button"
              class="season-btn active"
              data-season="summer"
              aria-pressed="true"
            >
              SUM
            </button>
            <button
              type="button"
              class="season-btn"
              data-season="autumn"
              aria-pressed="false"
            >
              AUT
            </button>
            <button
              type="button"
              class="season-btn"
              data-season="winter"
              aria-pressed="false"
            >
              WIN
            </button>
          </div>
        </div>
        <div class="mood">
          <span id="mood-name">GOLDEN HOUR</span>
          <span class="mood-time" id="mood-time">19:12</span>
        </div>
      </div>
      <div class="ui-bottom">
        <p class="caption">Same sea — <em>every hour a different blue.</em></p>
        <div class="controls">
          <button
            id="soundBtn"
            class="play-btn"
            type="button"
            aria-pressed="false"
            aria-label="Turn ambient sound on"
            title="Ambient sound"
          >
            ♪
          </button>
          <button
            id="rainBtn"
            class="play-btn muted"
            type="button"
            aria-pressed="false"
            aria-label="Turn rain on"
            title="Rain"
          >
            ☂
          </button>
          <button
            id="playBtn"
            class="play-btn"
            type="button"
            aria-pressed="false"
            aria-label="Play automatic time-lapse"
            title="Play time-lapse"
          >
            ▶
          </button>
          <div class="slider-wrap">
            <span class="slider-end">DAWN</span>
            <input
              type="range"
              id="time"
              min="0"
              max="1000"
              value="600"
              aria-label="Time of day, from dawn to night"
            />
            <span class="slider-end">NIGHT</span>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
